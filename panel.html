<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SideFlow</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; background: #0b0f14; color: #e5e7eb; display: grid; grid-template-rows: auto 1fr; }
    header { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 8px 10px; border-bottom: 1px solid #273141; }
    #address { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #94a3b8; font-size: 12px; }
    #external { border: 1px solid #334155; border-radius: 8px; padding: 6px 8px; background: #172033; color: #e5e7eb; cursor: pointer; }
    iframe { width: 100%; height: 100%; border: 0; background: white; }
    #error { margin: auto; max-width: 28rem; padding: 24px; text-align: center; color: #94a3b8; }
  </style>
</head>
<body>
  <header>
    <span id="address">Loading…</span>
    <button id="external" type="button" title="Open in a regular tab">Open in tab</button>
  </header>
  <div id="error" hidden>No valid web address was supplied.</div>
  <iframe id="content" title="SideFlow content"></iframe>
  <script src="panel.js"></script>
</body>
</html>
